<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Kanye West water bottle tweet</title><desc id="desc">Archival rendering of Kanye West's classic water bottle tweet.</desc>
  <rect width="1200" height="675" fill="#f4f0e7"/><rect x="55" y="55" width="1090" height="565" rx="28" fill="#fff" stroke="#171717" stroke-width="4"/>
  <circle cx="125" cy="130" r="38" fill="#e6492d"/><text x="125" y="143" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#fff">KW</text>
  <text x="185" y="124" font-family="Arial" font-size="31" font-weight="700" fill="#171717">Kanye West</text><text x="185" y="158" font-family="Arial" font-size="23" fill="#65717d">@kanyewest · Oct 16, 2010</text>
  <text x="95" y="245" font-family="Arial" font-size="40" fill="#171717"><tspan x="95" dy="0">I hate when I’m on a flight and I wake up with a</tspan><tspan x="95" dy="60">water bottle next to me like oh great now I gotta</tspan><tspan x="95" dy="60">be responsible for this water bottle</tspan></text>
  <line x1="95" y1="505" x2="1105" y2="505" stroke="#d7d2c8" stroke-width="2"/><text x="95" y="560" font-family="monospace" font-size="21" fill="#65717d">ARCHIVED CLASSIC TWITTER • MEME LIBRARY</text>
</svg>
